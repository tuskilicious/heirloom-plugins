name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Every plugin.json is valid and index.json is up to date
      run: python build_index.py --check
    - name: Every backend compiles
      run: python -m compileall -q .
