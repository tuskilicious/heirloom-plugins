name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
      fail-fast: false
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
    - name: Every plugin.json is valid and index.json is up to date
      run: python build_index.py --check
    - name: Heirloom, to load the plugins as it does
      run: python -m pip install pytest "heirloom-gl @ git+https://github.com/tuskilicious/heirloom"
    - name: Tests
      run: python -m pytest -q tests
